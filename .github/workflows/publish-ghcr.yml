name: Publish Docker image to GHCR

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          # Si tu Dockerfile está dentro de la carpeta backend-products
          context: ./backend-products
          push: true
          # Forzamos el nombre a minúsculas para evitar errores de manifest
          tags: ghcr.io/lufresno/proyecto-1:latest
